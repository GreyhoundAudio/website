<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>greyhound audio</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<style>
  @font-face {
    font-family: 'Inter';
    font-weight: 300;
    src: url('fonts/inter-latin-300-normal.woff2') format('woff2');
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    background: #0E0E0C;
    overflow: hidden;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  .ascii-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(1rem, 4vh, 2.5rem);
  }

  pre#ascii {
    font-family: 'SF Mono', 'Menlo', 'Consolas', monospace;
    line-height: 1.05;
    color: #E8E3D7;
    white-space: pre;
    text-align: center;
    letter-spacing: 0;
    user-select: none;
  }

  .ascii-char {
    display: inline-block;
    opacity: 0;
    animation: flicker-in 0.6s ease forwards;
  }

  @keyframes flicker-in {
    0%   { opacity: 0; }
    40%  { opacity: 0.15; }
    55%  { opacity: 0.6; }
    70%  { opacity: 0.2; }
    100% { opacity: 1; }
  }

  .caption {
    font-family: 'Inter', sans-serif;
    font-weight: 300;
    font-size: clamp(0.75rem, 1.6vw, 0.95rem);
    letter-spacing: 0.06em;
    text-transform: lowercase;
    color: rgba(232, 227, 215, 0.35);
    opacity: 0;
    transition: opacity 1s ease;
  }

  .caption.visible {
    opacity: 1;
  }

  .hint {
    position: fixed;
    bottom: 1.75rem;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Inter', sans-serif;
    font-weight: 300;
    font-size: 0.7rem;
    letter-spacing: 0.05em;
    text-transform: lowercase;
    color: rgba(232, 227, 215, 0.25);
    opacity: 0;
    transition: opacity 1s ease;
  }

  .hint.visible {
    opacity: 1;
  }

  /* Subtle ambient shimmer across the whole piece once fully revealed —
     a few random characters gently pulse, like an old terminal or a
     VU meter idling, rather than the whole thing looping or moving */
  .ascii-char.shimmer {
    animation: shimmer-pulse 2.6s ease-in-out infinite;
  }

  @keyframes shimmer-pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  @media (prefers-reduced-motion: reduce) {
    .ascii-char {
      animation: none !important;
      opacity: 1 !important;
    }
  }
</style>
</head>
<body onclick="window.location.href='index.html'">

  <div class="ascii-wrap">
    <pre id="ascii"></pre>
    <p class="caption" id="caption">greyhound audio — click to return</p>
  </div>

  <p class="hint" id="hint">you found this. good ear.</p>

                                    ", "                                   . =%#.. +@.+%%#=:=@##@@-    . :@= .. #@. .      .  . =% .                                      ", "                                   . -@+ ..=@:+@#*%*#+@%-- .   . .@* .. #@....       . :@@. .                                     ", "                                   ...@# . =@:*@-:   =@-.:..   . .@* ...#@.. .    .:.. -@@: .                                     ", "                                    . =@= .=@.+@. ..:@# .:..   . .@# .  %%.  .    .. . .@@- .                                     ", "                                     . +@- =@:+%%. .#%:.-. .    . %%. :=@%.== .      . .%@- .                                     ", "                                      . *@.-@=:+#%=:@*:*:..     . *@ +@=@@.:*. .      . #@+..                                     ", "                                      ...@**@-   #@%%::: .      . *@+@+ @#..=-..      . *@# .                                     ", "                                      . .*@@+*...%@@= . .       . *@@=.:@%:=...       . =@*: .                                    ", "                                        .-#@+*. :@@%.. .        . +@@= *=@@@- .       . -@@= .                                    ", "                                       ..+@@#  =#@@- .          ...%@@+%=*@@%. .      . .@@*..                                    ", "                                      . =@=+@: *@@@:..           . :@@#@%=@%@= .       . #@* .                                    ", "                                      . -@-:@= -@@+ .             . +@:=@**@@+ ..      . =@@...                                   ", "                                      ...%#-@+.:@@:..             ...%+ *:=@@# .       . .@@* .                                   ", "                                       . -@=#%-.%#..               . .*#: .@@* .. .     . *@%:.                                   ", "                                       ...%%:@* *+..                .  *@+.=@* =- . **...    . %#:..        ...@%...                        ", "                               ..-%@@*+-      ...%@@+=.              . :#=*#: .   . -#. :.        . =@+ .                         ", "                              . .%%:@++...     . .%@@+...           . .=+%#*:..   . #- .         ...#*- .                         ", "                             ...*@###*: .       . -@@@+:+..        . :*+-=*.-. . . =@*...        ..*+=:..                         ", "                             . +%##%+-..        ...@@+#-#. .       ..==*-+-.  ... .%@%. .         .:.- .                          ", "                            . =@#%=*@- .          .##*=@#*: .      ..=+:-+. .    .=:.-+..             .                           ", "                           ..:%#%=:#*:..         ..*%@*#*=@...       :--. .. :*=::= .#:..          ...                            ", "                           . -*+++:+:..          ...++#+#:** .           . . .--:::..:                                            ", "..........                    ....  .               ..:::: .         ....                                                         ", "                             .    ..               .                         ......  .                                            ", "                                                    ........                                                                      ", "                                                                                                                                  "];

    const asciiEl = document.getElementById('ascii');
    const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    const NUM_ROWS = lines.length;
    const NUM_COLS = Math.max(...lines.map(l => l.length));

    // Calculate an exact font-size that guarantees the full character
    // grid fits within the viewport, with room reserved for the caption
    // text below and comfortable margin on all sides. This is more
    // reliable than a fluid clamp()-based size, which can't account for
    // the exact relationship between a monospace font's real rendered
    // character width/height and a fixed 130x71 grid.
    function sizeAsciiToFit() {
      const vw = window.innerWidth;
      const vh = window.innerHeight;

      const reservedForCaption = 130; // px, caption + hint + gaps + margin
      const marginX = vw < 700 ? 24 : 64;
      const marginY = vw < 700 ? 24 : 48;

      const availableWidth = vw - marginX * 2;
      const availableHeight = vh - reservedForCaption - marginY * 2;

      // Monospace character cell: width ≈ 0.6 × font-size, height = font-size × line-height
      const CHAR_WIDTH_RATIO = 0.6;
      const LINE_HEIGHT = 1.05;

      const maxFontByWidth = availableWidth / (NUM_COLS * CHAR_WIDTH_RATIO);
      const maxFontByHeight = availableHeight / (NUM_ROWS * LINE_HEIGHT);

      // Small safety factor so rounding/font-metric differences across
      // browsers never push the grid past the calculated fit
      const fontSize = Math.max(2, Math.min(maxFontByWidth, maxFontByHeight) * 0.97);
      asciiEl.style.fontSize = fontSize + 'px';
    }

    sizeAsciiToFit();
    window.addEventListener('resize', sizeAsciiToFit);

    // Build the grid as individually-wrapped spans so each character can
    // animate in on its own, rather than the whole block appearing at once
    let html = '';
    let charIndex = 0;
    const totalChars = lines.reduce((sum, l) => sum + l.length, 0);

    lines.forEach((line, rowIndex) => {
      for (let i = 0; i < line.length; i++) {
        const ch = line[i] === ' ' ? '&nbsp;' : line[i];
        // Stagger delay: roughly diagonal sweep, top-left to bottom-right,
        // compressed into a reasonable total reveal time
        const delay = prefersReducedMotion ? 0 : (charIndex / totalChars) * 1.8;
        html += `<span class="ascii-char" style="animation-delay:${delay.toFixed(3)}s">${ch}</span>`;
        charIndex++;
      }
      html += '\n';
    });

    asciiEl.innerHTML = html;

    const totalRevealTime = prefersReducedMotion ? 0 : 1.8 + 0.6; // last delay + flicker duration

    // Once fully revealed: fade in the caption/hint, then apply a gentle
    // ambient shimmer to a small random sample of characters, like an
    // idling VU meter rather than a looping animation
    setTimeout(() => {
      document.getElementById('caption').classList.add('visible');
      document.getElementById('hint').classList.add('visible');

      if (!prefersReducedMotion) {
        const chars = asciiEl.querySelectorAll('.ascii-char');
        const nonBlank = Array.from(chars).filter(c => c.innerHTML !== '&nbsp;');
        const shimmerCount = Math.floor(nonBlank.length * 0.04);
        for (let i = 0; i < shimmerCount; i++) {
          const el = nonBlank[Math.floor(Math.random() * nonBlank.length)];
          el.classList.add('shimmer');
          el.style.animationDelay = (Math.random() * 2.6) + 's';
        }
      }
    }, totalRevealTime * 1000);
  </script>

</html>
