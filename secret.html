<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>greyhound audio</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<style>
  @font-face {
    font-family: 'Inter';
    font-weight: 300;
    src: url('fonts/inter-latin-300-normal.woff2') format('woff2');
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    background: #0E0E0C;
    overflow: hidden;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  .stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.5rem;
  }

  canvas#ascii {
    display: block;
  }

  .caption {
    font-family: 'Inter', sans-serif;
    font-weight: 300;
    font-size: clamp(0.75rem, 1.6vw, 0.95rem);
    letter-spacing: 0.06em;
    text-transform: lowercase;
    color: rgba(232, 227, 215, 0.35);
    opacity: 0;
    transition: opacity 1s ease;
  }

  .caption.visible {
    opacity: 1;
  }

  .hint {
    position: fixed;
    bottom: 1.75rem;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Inter', sans-serif;
    font-weight: 300;
    font-size: 0.7rem;
    letter-spacing: 0.05em;
    text-transform: lowercase;
    color: rgba(232, 227, 215, 0.25);
    opacity: 0;
    transition: opacity 1s ease;
  }

  .hint.visible {
    opacity: 1;
  }
</style>
</head>
<body onclick="window.location.href='index.html'">

  <div class="stage">
    <canvas id="ascii"></canvas>
    <p class="caption" id="caption">greyhound audio — click to return</p>
  </div>

  <p class="hint" id="hint">you found this. good ear.</p>

  <script>
    const lines = ["                                                                                                                                  ", "                                                                              ..... .                                             ", "                                                                         .....       .                                            ", "                                                                     ....     =*=+: .                                             ", "                                                                 ....    ..:+#%*+%@-%=...                                         ", "                                                              ...    .:=+=%%#=+-..@++=. ..  ..                                    ", "                                                           ...   :=+*#***@*. %*+@+@*- ...                                         ", "                                                      .....   .=#%%@***##=  .%#+@@*==..  ..=#...                                  ", "                                                ......     .=#%#=. -===:  .. .=+%*#@@= -++.:+. .                                  ", "                                               .      .-++*%#=:          .      :-- *@%**@.:-.: .                                 ", "                                         ....    ..:=#%%#+=:   ... .....     ... .-+%#@++-*- :-  .. .                             ", "                                        .     .+%%##*+:.    ...       ... ......-@*+%@@*@..+%: ..    .                            ", "                                       . .+**###=..     ....        .           =%--=%+-#%=:-.-.:+-.. .                           ", "                                       ..%@==-:     ....  .....  ...  ::  :::-==*@@@#-   #@%.:*+:-*.=.  .                         ", "                                     .. *@.    ....      .     ..   .###%%###*#*++*#%##+*@=+=-:++:=.-*:. .                        ", "                                    . .-@= ....         . .-+=.  .:-#@--*=..=-      .:=*#%@%@%+=+=+*:=%+.                         ", "                                   .--.+@:..             :%*+%*-*%#%*-.   ..=@+.....     .:-+#@@@#****@%==..                      ", "                                 . ..-.+@. .         ...+#*+%@@##=.    .... =@@. .  .....     .=**+=:===..                        ", "                                 . =-:.@# .          . -%+#@@#+::   ...... :@@#...       .....                                    ", "                                 . :=:-@= .            ..:*%++-....  .    -@%@* . .           ...........                         ", "                                 . -*:+@: .          .. .*@=+-. .     .=:-@=-@- .:..   ..                                         ", "                                 ..:=-%% .....      .  -@%=-. ..   ..:%%##+-@#...=   ..                                           ", "                                    .=@- .         . .*@=..  ..  ... #@#+-+@*... .:..  :. .                                       ", "                                  ...@% . :=-.    . .%%-=. .        .+=-*@@=-:=*-%+:.:*@- .                                       ", "                                  . .*@- :@=%=.. . :@#.## -.-::..:-*%%%=:@@:..%@%@-..=@= .                                        ", "                                    :+%# -@-%* .. -@#.%@##@.-:.  -@#-:=%*@@- :#%@+..:::: .                                        ", "                                  ...*%= +@-%+*. -@+.+@-.%%.   -*%*.    :%%..-*#%:..     ..                                       ", "                                  . .*#* +@.:#@#*@@.=%@. @#-...=@% ..... #%..-++. .  ..                                           ", "                                  . .*=@:.@* *@%:--.-*%*-@#=-.. =@- . ...@#..+-  .     . .. .                                     ", "                                   . *+@= -@#:+++-   :+#@%*......%%.... =@- .....      . =: .                                     ", "                                   . =%#.. +@.+%%#=:=@##@@-    . :@= .. #@. .      .  . =% .                                      ", "                                   . -@+ ..=@:+@#*%*#+@%-- .   . .@* .. #@....       . :@@. .                                     ", "                                   ...@# . =@:*@-:   =@-.:..   . .@* ...#@.. .    .:.. -@@: .                                     ", "                                    . =@= .=@.+@. ..:@# .:..   . .@# .  %%.  .    .. . .@@- .                                     ", "                                     . +@- =@:+%%. .#%:.-. .    . %%. :=@%.== .      . .%@- .                                     ", "                                      . *@.-@=:+#%=:@*:*:..     . *@ +@=@@.:*. .      . #@+..                                     ", "                                      ...@**@-   #@%%::: .      . *@+@+ @#..=-..      . *@# .                                     ", "                                      . .*@@+*...%@@= . .       . *@@=.:@%:=...       . =@*: .                                    ", "                                        .-#@+*. :@@%.. .        . +@@= *=@@@- .       . -@@= .                                    ", "                                       ..+@@#  =#@@- .          ...%@@+%=*@@%. .      . .@@*..                                    ", "                                      . =@=+@: *@@@:..           . :@@#@%=@%@= .       . #@* .                                    ", "                                      . -@-:@= -@@+ .             . +@:=@**@@+ ..      . =@@...                                   ", "                                      ...%#-@+.:@@:..             ...%+ *:=@@# .       . .@@* .                                   ", "                                       . -@=#%-.%#..               . .*#: .@@* .. .     . *@%:.                                   ", "                                       ...%%:@* *+..                .  *@+.=@* =- .     ..:@@:..                                  ", "                                        . -@=+@.=- .                 .. *@@-%%... .      . +@#= .                                 ", "                                         ..#%=@=..                    .. =@@@@:.-. ..    .. #@%. .                                ", "                                         . =@=@* .                      . :#@#===--  .    ...%@+...                               ", "                                        ..:#%=+@:..                      .  =@#.+-**. .    . :%@* ..                              ", "                                        . *@%#.@* .                       ...@*:-+ -+: .    . .%@=  .                             ", "                                       . -@@*##*@:..                      . .%+*.#= .=- ..   . .*@+: .                            ", "                                      ...@@%.:@+@* .                      . =#=@ +*+  ++  .   .  =@%: .                           ", "                                     .. *@@#. %%*@...                     . =%+@-.-@*. =#. .   .. -@*-..                          ", "                                     . =@@#-..=@-@* .                     . +%-@+..%@#. %%...    . -#*...                         ", "                                   ...+@%#=-. :@++@:..                    . %+.*:  :%@@-.@- .     . +%. .                         ", "                                   . #@%%:=: . %%:@+                     ..-#=+ . . -##@==: .     ...@*..                         ", "                                  . -@-+@:=... =@-@*-...                 . *--*=.. . #*##          . %%...                        ", "                                  ..%@+@#-. .. .@+=@#: .                . -*-=...  ..*@=...        ..#@. .                        ", "                                 . -@@%=*- .  ..%% @# .                . .@+..     ..*@*..         . #@. .                        ", "                                . .@@@+=-..   . +@+%*: .              . .+**...    . %#:..        ...@%...                        ", "                               ..-%@@*+-      ...%@@+=.              . :#=*#: .   . -#. :.        . =@+ .                         ", "                              . .%%:@++...     . .%@@+...           . .=+%#*:..   . #- .         ...#*- .                         ", "                             ...*@###*: .       . -@@@+:+..        . :*+-=*.-. . . =@*...        ..*+=:..                         ", "                             . +%##%+-..        ...@@+#-#. .       ..==*-+-.  ... .%@%. .         .:.- .                          ", "                            . =@#%=*@- .          .##*=@#*: .      ..=+:-+. .    .=:.-+..             .                           ", "                           ..:%#%=:#*:..         ..*%@*#*=@...       :--. .. :*=::= .#:..          ...                            ", "                           . -*+++:+:..          ...++#+#:** .           . . .--:::..:                                            ", "..........                    ....  .               ..:::: .         ....                                                         ", "                             .    ..               .                         ......  .                                            ", "                                                    ........                                                                      ", "                                                                                                                                  "];

    const canvas = document.getElementById('ascii');
    const ctx = canvas.getContext('2d');
    const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    const NUM_ROWS = lines.length;
    const NUM_COLS = Math.max(...lines.map(l => l.length));

    const INK = '232, 227, 215'; // rgb components, used with variable alpha

    let fontSize, charWidth, lineHeight, dpr;

    // Precompute per-character reveal delay (diagonal-ish sweep) once —
    // this replaces thousands of individually animated DOM elements with
    // a single canvas that's redrawn each frame. Same visual effect,
    // vastly cheaper: one draw call touches every character instead of
    // the browser tracking one CSS animation per character.
    const totalChars = NUM_ROWS * NUM_COLS;
    let charIndex = 0;
    const delays = [];
    for (let r = 0; r < NUM_ROWS; r++) {
      delays.push([]);
      for (let c = 0; c < NUM_COLS; c++) {
        delays[r].push((charIndex / totalChars) * 1200); // ms
        charIndex++;
      }
    }

    // A small set of characters get a gentle ambient shimmer once the
    // reveal completes — chosen once, reused every frame, rather than
    // querying/animating DOM nodes.
    let shimmerCells = [];
    function pickShimmerCells() {
      const nonBlank = [];
      for (let r = 0; r < NUM_ROWS; r++) {
        for (let c = 0; c < NUM_COLS; c++) {
          if (lines[r][c] && lines[r][c] !== ' ') nonBlank.push([r, c]);
        }
      }
      const count = Math.floor(nonBlank.length * 0.04);
      const chosen = [];
      for (let i = 0; i < count; i++) {
        const pick = nonBlank[Math.floor(Math.random() * nonBlank.length)];
        chosen.push({ r: pick[0], c: pick[1], phase: Math.random() * Math.PI * 2 });
      }
      return chosen;
    }

    function sizeCanvas() {
      const vw = window.innerWidth;
      const vh = window.innerHeight;

      const reservedForCaption = 130;
      const marginX = vw < 700 ? 24 : 64;
      const marginY = vw < 700 ? 24 : 48;

      const availableWidth = vw - marginX * 2;
      const availableHeight = vh - reservedForCaption - marginY * 2;

      const CHAR_WIDTH_RATIO = 0.6;
      const LINE_HEIGHT_RATIO = 1.05;

      const maxFontByWidth = availableWidth / (NUM_COLS * CHAR_WIDTH_RATIO);
      const maxFontByHeight = availableHeight / (NUM_ROWS * LINE_HEIGHT_RATIO);

      fontSize = Math.max(2, Math.min(maxFontByWidth, maxFontByHeight) * 0.97);
      charWidth = fontSize * CHAR_WIDTH_RATIO;
      lineHeight = fontSize * LINE_HEIGHT_RATIO;

      dpr = Math.min(window.devicePixelRatio || 1, 2); // cap DPR to keep the backing canvas reasonable on very high-density phone screens

      const cssWidth = NUM_COLS * charWidth;
      const cssHeight = NUM_ROWS * lineHeight;

      canvas.style.width = cssWidth + 'px';
      canvas.style.height = cssHeight + 'px';
      canvas.width = cssWidth * dpr;
      canvas.height = cssHeight * dpr;

      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.font = fontSize + 'px SF Mono, Menlo, Consolas, monospace';
      ctx.textBaseline = 'top';
    }

    sizeCanvas();
    window.addEventListener('resize', sizeCanvas);

    const startTime = performance.now();
    const revealDuration = prefersReducedMotion ? 0 : 1200;
    const flickerDuration = 400;
    let revealComplete = prefersReducedMotion;
    let animationFrameId = null;

    // Paint one frame immediately (synchronously), so something is always
    // visible even before the first requestAnimationFrame callback fires
    draw(performance.now());
    animationFrameId = requestAnimationFrame(draw);

    function draw(now) {
      const elapsed = now - startTime;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let r = 0; r < NUM_ROWS; r++) {
        const line = lines[r];
        for (let c = 0; c < NUM_COLS; c++) {
          const ch = line[c];
          if (!ch || ch === ' ') continue;

          let alpha;
          if (prefersReducedMotion) {
            alpha = 1;
          } else {
            const localElapsed = elapsed - delays[r][c];
            if (localElapsed <= 0) {
              alpha = 0;
            } else if (localElapsed >= flickerDuration) {
              alpha = 1;
            } else {
              // quick flicker curve: dim, brief bright flash, settle to full
              const t = localElapsed / flickerDuration;
              if (t < 0.4) alpha = t * 0.375;
              else if (t < 0.55) alpha = 0.15 + (t - 0.4) * 3;
              else if (t < 0.7) alpha = 0.6 - (t - 0.55) * 2.67;
              else alpha = 0.2 + (t - 0.7) * 2.67;
            }
          }

          ctx.fillStyle = 'rgba(' + INK + ', ' + Math.max(0, Math.min(1, alpha)) + ')';
          ctx.fillText(ch, c * charWidth, r * lineHeight);
        }
      }

      // Ambient shimmer once the reveal has finished
      if (revealComplete || elapsed > revealDuration + flickerDuration) {
        if (!revealComplete) {
          revealComplete = true;
          shimmerCells = prefersReducedMotion ? [] : pickShimmerCells();
          document.getElementById('caption').classList.add('visible');
          document.getElementById('hint').classList.add('visible');
        }
        const t = now / 1000;
        for (const cell of shimmerCells) {
          const ch = lines[cell.r][cell.c];
          const shimmerAlpha = 0.7 + 0.3 * Math.sin(t * 2.4 + cell.phase);
          ctx.fillStyle = 'rgba(' + INK + ', ' + shimmerAlpha + ')';
          ctx.fillText(ch, cell.c * charWidth, cell.r * lineHeight);
        }
      }

      animationFrameId = requestAnimationFrame(draw);
    }

    // Stop the render loop if the tab is hidden, to avoid burning
    // battery/CPU on a page nobody is looking at
    document.addEventListener('visibilitychange', () => {
      if (document.hidden && animationFrameId) {
        cancelAnimationFrame(animationFrameId);
        animationFrameId = null;
      } else if (!document.hidden && !animationFrameId) {
        animationFrameId = requestAnimationFrame(draw);
      }
    });
  </script>

</body>
</html>
