  <main class="page-content">
    <h1 class="page-title">contact.</h1>
    <p class="lede">get in touch about mastering, mixing, or a project you've got coming up.</p>

    <!--
      FORM SETUP — read before going live:
      1. Go to formspree.io and create a free account
      2. Create a new form, and copy the unique endpoint it gives you
         (looks like https://formspree.io/f/xxxxxxxx)
      3. Replace YOUR_FORM_ID below with that ID
      4. In Formspree's dashboard, set the form's target email to
         connor@greyhoundaudio.com
      Free tier covers 50 submissions/month.
    -->
    <form class="contact-form" action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
      <div class="form-field">
        <label for="name">name</label>
        <input type="text" id="name" name="name" required>
      </div>

      <div class="form-field">
        <label for="email">email</label>
        <input type="email" id="email" name="email" required>
      </div>

      <div class="form-field">
        <label for="message">message</label>
        <textarea id="message" name="message" required></textarea>
      </div>

      <!-- honeypot field for basic spam filtering — hidden from real
           users via CSS, but bots that auto-fill every field will
           trip it, and Formspree silently discards submissions where
           it's filled in -->
      <input type="text" name="_gotcha" style="display:none">

      <button type="submit" class="form-submit">send</button>
    </form>

    <p class="form-note">or email directly —
      <a href="mailto:connor@greyhoundaudio.com" style="color: var(--accent);">connor@greyhoundaudio.com</a>
    </p>

    <div class="contact-block">
      <p class="contact-label">instagram</p>
      <div class="contact-row">
        <a href="https://instagram.com/greyhound.audio" target="_blank" rel="noopener">@greyhound.audio</a>
      </div>
    </div>
  </main>

  <picture>
    <source srcset="images/greyhound-mark.webp" type="image/webp">
    <img class="corner-logo" src="images/greyhound-mark.png" alt="" loading="lazy">
